<title>Objection Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky tab bar over a single reading column; cards expand in place; drill is one card at a time. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#14213d; --muted:#5a667d; --line:#d9dee6;
  --accent:#0e6f7a; --accent-ink:#ffffff; --accent-soft:#dff0f2;
  --good:#1f7a4d; --good-soft:#dcefe4; --warn:#9a5b00; --warn-soft:#fbeccd; --bad:#a63a2e; --bad-soft:#f6dedb;
  --f-display:"Archivo Narrow","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#18233a; --ink:#e8edf5; --muted:#9aa7bd; --line:#2b3954;
  --accent:#4fc0cc; --accent-ink:#06222a; --accent-soft:#16384a;
  --good:#5cc592; --good-soft:#153a2b; --warn:#f0b35a; --warn-soft:#3d2c10; --bad:#f08a7c; --bad-soft:#40201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#18233a; --ink:#e8edf5; --muted:#9aa7bd; --line:#2b3954;
  --accent:#4fc0cc; --accent-ink:#06222a; --accent-soft:#16384a;
  --good:#5cc592; --good-soft:#153a2b; --warn:#f0b35a; --warn-soft:#3d2c10; --bad:#f08a7c; --bad-soft:#40201c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;padding-block:8px 16px}
h1{font-family:var(--f-display);font-size:34px;line-height:1.05;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:12px}
.stats b{color:var(--ink)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav button{flex:1;min-width:0;font:600 13px var(--f-body);padding:10px 4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.tab{display:none;padding-top:20px}
section.tab.on{display:block}
h2{font-family:var(--f-display);font-size:24px;margin:28px 0 8px}
h3{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.say p{margin:0 0 10px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.rules li{border-top:2px solid var(--accent);padding-top:8px}
.rules b{display:block;font-family:var(--f-display);font-size:18px}
.rules span{color:var(--muted);font-size:14px}
.step{display:grid;grid-template-columns:96px 1fr;gap:10px;margin:0 0 10px}
.step i{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding-top:3px;font-style:normal}
.step div{min-width:0}
@media(max-width:480px){.step{grid-template-columns:1fr;gap:0}}
.facts{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:500 12px var(--f-mono);padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
.idx{font:500 12px var(--f-mono);color:var(--muted);min-width:22px}
.ttl{font-weight:600;flex:1;min-width:0}
.pill{font:500 11px var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.Sophisticated{background:var(--bad-soft)} .pill.Hard{background:var(--warn-soft)} .pill.Beginner{background:var(--good-soft)}
.st{font:500 11px var(--f-mono);min-width:56px;text-align:right;color:var(--muted)}
.st.n{color:var(--good)} .st.w{color:var(--bad)}
.body{padding:2px 16px 16px}
.quote{font-family:var(--f-display);font-size:21px;line-height:1.25;margin:4px 0 0}
.box{border-radius:6px;padding:10px 12px;font-size:14px;margin-top:8px}
.box.dont{background:var(--bad-soft)} .box.flag{background:var(--warn-soft)} .box.rev{background:var(--accent-soft)}
.box ul{margin:4px 0 0;padding-left:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{font:600 14px var(--f-body);padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:var(--bg);border-color:var(--good)}
.btn.bad{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.drillbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
select{font:500 13px var(--f-body);padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prompt{color:var(--muted);font-style:italic;margin:12px 0}
.names{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.empty{color:var(--muted);padding:24px 0}

textarea{width:100%;min-height:84px;font:15px var(--f-body);padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.log{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:92%;padding:10px 12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg b{display:block;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.sc{align-self:stretch;max-width:100%;background:var(--warn-soft)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Objection Playbook</h1>
      <div class="sub">15 objections, the Kieran and Col method, in your voice. Data as of <span id="asof"></span>.</div>
    </div>
    <div>
      <div class="stats" id="stats"></div>
      <label class="names"><input type="checkbox" id="hide"> Hide coach names</label>
    </div>
  </header>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-t="method" aria-selected="true">Method</button>
    <button role="tab" data-t="cards" aria-selected="false">Objections</button>
    <button role="tab" data-t="drill" aria-selected="false">Drill</button>
    <button role="tab" data-t="ask" aria-selected="false">Ask</button>
    <button role="tab" data-t="rp" aria-selected="false">Role-play</button>
  </nav>

  <section class="tab on" id="t-method"></section>
  <section class="tab" id="t-cards"></section>
  <section class="tab" id="t-drill"></section>
  <section class="tab" id="t-ask"></section>
  <section class="tab" id="t-rp"></section>
</div>

<script>
const D = {
 "method": [
  {
   "t": "Never go first",
   "d": "Open with: \"Tell me why you're feeling the way you do.\" They speak, you dissect. If you go first, they dissect you."
  },
  {
   "t": "Set the finish line early",
   "d": "In the first two minutes: \"I'm here to solve this with you. By the end of this call we'll have a solution.\" Don't ask them to hand you their problems. Lead the call."
  },
  {
   "t": "One objection at a time",
   "d": "Take them apart piece by piece. Ask questions until you find the one that is driving the rest. There is always a hidden one."
  },
  {
   "t": "Never confirm a limitation",
   "d": "If they say \"am I limited?\" never say yes. Say \"there are absolutely no limitations.\" Then reframe: next in line, best fit for your numbers."
  },
  {
   "t": "Hold course",
   "d": "When they push, don't run to the worst case. If they say \"time out of the market,\" the answer is \"you are in the market, it's in your name.\" Stay on the path."
  },
  {
   "t": "Back to fundamentals",
   "d": "Why are we here? Capital growth, a business decision, building wealth for later. Cash flow matters, but it is not the point. Circle back every time."
  },
  {
   "t": "Short and sharp",
   "d": "Three to five sentences, then a question. Nobody wins by talking for four minutes. Use \"Look,\" to bridge into the answer."
  },
  {
   "t": "Do the maths together",
   "d": "Get them to type it into their phone. A number they calculate themselves is a number they believe."
  },
  {
   "t": "Lead with authority",
   "d": "If an idea hurts them, say it: \"We're not doing that, it isn't in your best interest.\" Then ask what they think the better way is. Be the guide, not the order taker."
  },
  {
   "t": "Always close on a question",
   "d": "Finish every answer with a question that asks for a small yes. Don't leave a statement hanging."
  }
 ],
 "opener": {
  "title": "The opening, before you answer anything",
  "say": [
   "Hi [Name], thanks for jumping on. I've read your email, and I'm glad you raised this with me.",
   "I'm here to solve whatever is sitting with you, and by the end of this call we'll have a clear answer. So first, I just want to hear from you.",
   "Tell me a bit about why you're feeling uneasy, and what you'd like to iron out. Then we'll go through each one, one at a time."
  ],
  "why": "You set the finish line, you lead, and they speak first. That is the whole game."
 },
 "preframe": {
  "title": "Pre-frame delayed registration in the presentation",
  "say": [
   "Before we get to the numbers, one thing I tell every client. The date for registration is a plan, not a promise. It's the same for every buyer on every estate, because weather, council and soil are outside anyone's control.",
   "Even if it registers exactly on time, finance and settlement need another four to six weeks. So the timeline already has room built in.",
   "And we're buying for capital growth, not cash flow. You hold the land from the day you sign. Does that make sense so far?"
  ],
  "why": "Kieran: if you don't prepare them for it up front, it comes back and bites you. Say it before they find it."
 },
 "cards": [
  {
   "id": 1,
   "title": "Land size is too small",
   "cat": "Product",
   "level": "Hard",
   "src": "Transcript",
   "line": "\"The block is too small. I want around 450 square metres. My mates say bigger land grows faster.\"",
   "fear": "Settling for second best. Worried about growth. Borrowing someone else's opinion.",
   "open": [
    "\"Walk me through 450. What are you hoping it gives you?\"",
    "\"Where did your mates buy, what did they pay, and was it fixed price and turnkey?\""
   ],
   "say": [
    {
     "l": "Acknowledge",
     "t": "Look, good question, and I'd rather you raise it now."
    },
    {
     "l": "Reframe",
     "t": "A bigger block means a bigger house on it, so the price climbs and your borrowing capacity shrinks. Past a point you are spending more and getting less back."
    },
    {
     "l": "Fundamentals",
     "t": "The tenant pays rent for the location, the bedrooms and the price. They don't pay for an extra 70 square metres. This is a business decision, and we keep you under budget with room to move."
    },
    {
     "l": "Close",
     "t": "If the numbers and the location work, is the size really the thing sitting with you, or is it something else?"
    }
   ],
   "pivot": "Equilibrium point: overspending on land or build past it doesn't come back as rent or value. Keep the deposit small, keep the asset working.",
   "close": "Out of the numbers, the location and the size, which one is really bothering you?",
   "bounce": {
    "c": "\"My mates said never go under 450.\"",
    "r": "\"They're entitled to their view, and it depends on what they actually bought. Let's compare like for like. Fixed price, turnkey, landscaping, driveway, fencing, all in? Once everything is included, which one leaves you in the better position?\""
   },
   "dont": [
    "Don't say \"growth will be exactly the same on any block.\" Land content matters and you can't promise it.",
    "Don't ramble for four minutes (you did on this one).",
    "Don't put their friends down."
   ],
   "flag": "Say it trades off against price and borrowing capacity. Don't promise equal growth across block sizes.",
   "review": {
    "said": "You asked \"why 450?\" and who their friends bought through. You then ran a long answer and claimed growth would be identical.",
    "fix": "Keep the questions, they were good. Cut the answer to four sentences, drop the equal growth claim, end on a question."
   }
  },
  {
   "id": 2,
   "title": "The laundry is in the middle of the house",
   "cat": "Product",
   "level": "Beginner",
   "src": "Transcript",
   "line": "\"The laundry is right across from the bedrooms. I want it on the side with doors out to the yard. Is the plan fixed?\"",
   "fear": "Tenants complaining about noise. Wanting control over the design.",
   "open": [
    "\"Tell me why. What's the issue for you?\"",
    "\"Do you plan to live in it?\""
   ],
   "say": [
    {
     "l": "Acknowledge",
     "t": "Fair enough, I hear you, and I can take it to the builder."
    },
    {
     "l": "Reframe",
     "t": "Here's the straight answer. A layout change means a redesign, new engineering and a new price. You're not living there. Tenants pick on location, bedrooms and price. A working laundry is a working laundry."
    },
    {
     "l": "Lead",
     "t": "Every dollar we add is a dollar you carry, and it won't lift the rent. I'd rather that money sit in your offset. So no, we're not doing that."
    },
    {
     "l": "Close",
     "t": "Do you want me to price it so you can see the number, and if it's large, we leave it as is?"
    }
   ],
   "pivot": "Overcapitalising on a rental doesn't return. Business decision, not a dream home.",
   "close": "If I price the change and it's thousands for no rent uplift, are you happy to leave it as designed?",
   "bounce": {
    "c": "\"But I want it right. Tenants will complain.\"",
    "r": "\"Most don't, it's a common layout. Let me get the price, and then you decide with the number in front of you. Deal?\""
   },
   "dont": [
    "Don't say \"you can't change it.\" Say what it costs.",
    "Don't agree to chase the builder without a cost conversation first."
   ],
   "flag": "Layout changes may not be possible after contract. Confirm with the builder before promising a price.",
   "review": {
    "said": "Asked why, asked if they'd live in it, said you'd rather the money sit in an offset. Kieran said this was handled well.",
    "fix": "Keep it as is. Add the \"price it, then decide\" close so they agree to a rule before the number appears."
   }
  },
  {
   "id": 3,
   "title": "The holding cost is too much for me",
   "cat": "Cash flow",
   "level": "Hard",
   "src": "Transcript",
   "line": "\"That's a lot every week. I feel out of my depth. I'm scared I can't stay on top of it.\"",
   "fear": "Being squeezed. Losing control of their money. Not understanding the product.",
   "open": [
    "\"Is it the number itself, or the idea of being stuck if something changes?\"",
    "\"Walk me through what you save each pay at the moment.\""
   ],
   "say": [
    {
     "l": "Acknowledge",
     "t": "Look, that's a fair reaction, and I'd be asking the same."
    },
    {
     "l": "Split it",
     "t": "The figure on the plan is before tax. With a PAYG variation, the tax benefit comes into every pay instead of waiting for your tax return. So the real cash you put in is lower."
    },
    {
     "l": "Maths together",
     "t": "Type this in. Price times the interest rate, divided by 12. If you lived in this yourself, interest alone is about $4,273 a month, before any principal, rates or insurance. As an investor, the tenant and tax carry most of it."
    },
    {
     "l": "Close",
     "t": "If the after-tax cost sits at a number that works for your pay, and you've got an offset behind you, would that feel manageable?"
    }
   ],
   "pivot": "You're holding a nearly $700k asset for a fraction of what living in it would cost. That's leverage.",
   "close": "With the number at that level and a buffer behind it, is that something you can do comfortably?",
   "bounce": {
    "c": "\"What if rates go up or the tenant leaves?\"",
    "r": "\"Rates have gone up this year, the cash rate is 4.60% as of 30 September. That's why we stress test above today's rate and keep a buffer and an offset behind you. Rental vacancy is tight across the capitals too. Want to see where it breaks?\""
   },
   "dont": [
    "Don't say \"it's less than my food shop.\" Respect their number.",
    "Don't call it affordable until you've compared it with their savings for the same period (weekly vs fortnightly).",
    "Don't quote numbers you haven't checked."
   ],
   "flag": "In the call, $283 a week (about $566 a fortnight) was compared against savings of $500 to $1,000 a fortnight. At the low end that is all of it. Check the plan's actual figures and period before you say it's affordable. Annual: $283 x 52 = $14,716, not $569 x 52.",
   "review": {
    "said": "You realised the pack numbers were wrong mid-call, then did the maths together on the phone. Kieran loved that trick.",
    "fix": "Check the pack numbers before the call. Say gross vs after-tax once, cleanly. Use the corrected figures: about $4,273 a month interest, $5,273 with $1,000 principal, $63,282 a year."
   }
  },
  {
   "id": 4,
   "title": "Unregistered land and delays",
   "cat": "Timing",
   "level": "Sophisticated Investor",
   "src": "Transcript",
   "line": "\"Everyone says never buy unregistered land. If it drags out I lose time in the market, rent, and my ability to use equity.\"",
   "fear": "Being locked in with nothing to show. Stories from others. Losing control of timing.",
   "open": [
    "\"Where did you hear that? What actually happened to them?\"",
    "\"Is it the delay itself, or what the delay costs you?\"",
    "\"If it registered on time, is there anything else holding you back?\""
   ],
   "say": [
    {
     "l": "Acknowledge",
     "t": "You're right to ask. Nobody controls the weather or the council, so every date is a plan, not a promise. We've been through this many times and I'm confident in this one."
    },
    {
     "l": "Timeline",
     "t": "Even if it registers on schedule, finance and settlement still need four to six weeks. The timeline already has that room built in."
    },
    {
     "l": "Fundamentals",
     "t": "We're not buying for cash flow, we're buying for growth. Four weeks of rent is about $2,000. The land is in your name from contract, so any growth in that time is yours, and it's worth far more than $2,000 if the market performs as projected."
    },
    {
     "l": "Hold course",
     "t": "You are in the market. It's in your name. Don't fixate on a couple of weeks of rent. Does that make sense?"
    }
   ],
   "pivot": "Short-term pain, long-term gain. The delay builds equity, it doesn't cost it.",
   "close": "Is it the weeks of rent that worry you, or is there something else behind it?",
   "bounce": {
    "c": "\"Give me a worst case.\"",
    "r": "\"Worst realistic case is a few more weeks. Eight weeks at $500 is about $4,000 of rent. Against that, you hold land that's growing, and your contract has a sunset clause that protects you if dates blow out. I'll walk you through it.\""
   },
   "dont": [
    "Don't say \"I can't give you a straight answer.\" Say what you can: the plan, the process, your confidence.",
    "Don't jump to \"finance gets declined.\" That's you handing them the worst case.",
    "Don't answer before you've asked where the story came from."
   ],
   "flag": "Check the actual contract: sunset date, deposit held in trust, rights if registration isn't reached. Don't quote a clause you haven't read. Don't guarantee growth.",
   "review": {
    "said": "You asked where the stories came from and used the \"no mortgage, still growing\" point. Then you said \"I can't give you a straight answer\" and gave finance declined as the worst case.",
    "fix": "Kieran's fix: you ARE in the market. Four weeks is $2,000, growth is bigger. Hold course, then pre-frame this in the presentation next time."
   }
  },
  {
   "id": 5,
   "title": "My mate paid less / online says don't buy",
   "cat": "Influence",
   "level": "Beginner",
   "src": "Bank",
   "line": "\"My mate bought for less, and the reviews online are terrible.\"",
   "fear": "Being the mug. Doing it alone with no one to trust.",
   "open": [
    "\"What did they buy? Brand new or established? Fixed price, turnkey?\"",
    "\"Did they go retail, or through a vetted channel with someone looking after them?\""
   ],
   "say": [
    {
     "l": "Acknowledge",
     "t": "Everyone has an opinion, and I'm glad you're checking."
    },
    {
     "l": "Compare",
     "t": "Let's put their numbers next to yours, line by line. Landscaping, fencing, driveway, letterbox, clothesline. On retail packages those are often extra and it adds up fast."
    },
    {
     "l": "Trust",
     "t": "Every builder and developer we work with is vetted, and we've worked with them for years. That's the difference."
    },
    {
     "l": "Close",
     "t": "If their deal and this one came out the same once everything's included, would that settle it?"
    }
   ],
   "pivot": "Apples with apples. The headline price isn't the price.",
   "close": "If it's equal once it's all in, does that clear it up for you?",
   "bounce": {
    "c": "\"But there are loads of bad reviews.\"",
    "r": "\"People post when something goes wrong, so reviews lean negative. Let's look at the specific issue that worried you and I'll show you how it's handled here. Which one was it?\""
   },
   "dont": [
    "Don't say \"your mates are wrong.\"",
    "Don't use a story about a friend you can't back up."
   ],
   "flag": "Only use the vetted-channel and years-of-relationship points if they hold for this specific builder. No builder names in client materials."
  },
  {
   "id": 6,
   "title": "What if it values under the contract price?",
   "cat": "Finance",
   "level": "Sophisticated Investor",
   "src": "Bank",
   "line": "\"What if the bank values it below what I'm paying? I'd have to find the difference.\"",
   "fear": "Surprise cash bill at settlement. Overpaying.",

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let hide = false, filter = 'All', prog = {}, open = null, dl = 'All', drillOrder = [], di = 0, revealed = false;

function load(){ try{ prog = JSON.parse(localStorage.getItem('opb-progress')||'{}'); hide = localStorage.getItem('opb-hide')==='1'; }catch(e){} }
function save(){ try{ localStorage.setItem('opb-progress', JSON.stringify(prog)); localStorage.setItem('opb-hide', hide?'1':'0'); }catch(e){} }
const nm = s => { s = esc(s); return hide ? s.replace(/Kieran/g,'Coach').replace(/\bCol\b/g,'Coach') : s; };

function stats(){
  const n = D.cards.filter(c=>prog[c.id]==='n').length, w = D.cards.filter(c=>prog[c.id]==='w').length;
  $('#stats').innerHTML = `<span>Nailed <b>${n}</b>/${D.cards.length}</span><span>Weak <b>${w}</b></span>`;
}

function steps(c){ return c.say.map(s=>`<div class="step"><i>${esc(s.l)}</i><div>${nm(s.t)}</div></div>`).join(''); }

function method(){
  $('#t-method').innerHTML = `
    <h2>${nm(D.opener.title)}</h2>
    <div class="panel say">${D.opener.say.map(p=>`<p>${nm(p)}</p>`).join('')}<p style="color:var(--muted);font-size:13px;margin:0">${nm(D.opener.why)}</p></div>
    <h2>The ten rules</h2>
    <ul class="rules">${D.method.map(m=>`<li><b>${nm(m.t)}</b><span>${nm(m.d)}</span></li>`).join('')}</ul>
    <h2>${nm(D.preframe.title)}</h2>
    <div class="panel say">${D.preframe.say.map(p=>`<p>${nm(p)}</p>`).join('')}<p style="color:var(--muted);font-size:13px;margin:0">${nm(D.preframe.why)}</p></div>
    <h2>Numbers to check before you use them</h2>
    <div class="facts">${D.facts.map(f=>`<div>${esc(f)}</div>`).join('')}
      <div style="margin-top:6px">Example from your call: $684,668 at 7.49% is about $${D.maths.interest_yr.toLocaleString()} a year, $${D.maths.interest_mo.toLocaleString()} a month in interest. With $1,000 principal, $${D.maths.own_mo.toLocaleString()} a month, $${D.maths.own_yr.toLocaleString()} a year. Use the lender's actual rate for each client.</div></div>`;
}

function cardHTML(c){
  const s = prog[c.id];
  return `<details class="card" data-id="${c.id}" ${open===c.id?'open':''}>
    <summary><span class="idx">${String(c.id).padStart(2,'0')}</span><span class="ttl">${esc(c.title)}</span>
      <span class="pill ${c.level.split(' ')[0]}">${esc(c.level)}</span>
      <span class="st ${s||''}">${s==='n'?'Nailed':s==='w'?'Weak':''}</span></summary>
    <div class="body">
      <h3>The client says &middot; ${esc(c.cat)} &middot; ${esc(c.src)}</h3>
      <p class="quote">${esc(c.line)}</p>
      <h3>What they are really afraid of</h3><div>${nm(c.fear)}</div>
      <h3>Ask first, don't go first</h3><ul style="margin:0;padding-left:18px">${c.open.map(o=>`<li>${nm(o)}</li>`).join('')}</ul>
      <h3>Your answer</h3>${steps(c)}
      <h3>Back to fundamentals</h3><div>${nm(c.pivot)}</div>
      <h3>Close with a question</h3><div><b>${nm(c.close)}</b></div>
      <h3>The harder come-back</h3><div>${nm(c.bounce.c)}</div><div style="margin-top:4px">${nm(c.bounce.r)}</div>
      <div class="box dont"><b>Don't</b><ul>${c.dont.map(d=>`<li>${nm(d)}</li>`).join('')}</ul></div>
      <div class="box flag"><b>Check before you say it</b><br>${nm(c.flag)}</div>
      ${c.review?`<div class="box rev"><b>From your call with Kieran</b><br>You: ${nm(c.review.said)}<br>Fix: ${nm(c.review.fix)}</div>`:''}
      <div class="actions">
        <button class="btn good" data-mark="n" data-id="${c.id}">Nailed it</button>
        <button class="btn bad" data-mark="w" data-id="${c.id}">Still weak</button>
        <button class="btn" data-mark="x" data-id="${c.id}">Clear</button>
      </div>
    </div></details>`;
}

const FILTERS = ['All','Transcript','Beginner','Hard','Sophisticated Investor','Weak','Nailed'];
function cards(){
  const list = D.cards.filter(c=>{
    if(filter==='All') return true;
    if(filter==='Transcript') return c.src==='Transcript';
    if(filter==='Weak') return prog[c.id]==='w';
    if(filter==='Nailed') return prog[c.id]==='n';
    return c.level===filter;
  });
  $('#t-cards').innerHTML = `<div class="chips">${FILTERS.map(f=>`<button class="chip" data-f="${f}" aria-pressed="${f===filter}">${f}</button>`).join('')}</div>`
    + (list.length? list.map(cardHTML).join('') : '<div class="empty">Nothing here yet. Mark a few objections as you drill.</div>');
}

function buildDeck(){
  const pool = D.cards.filter(c=> dl==='All' || c.level===dl);
  const rank = c => prog[c.id]==='w'?0 : !prog[c.id]?1 : 2;
  drillOrder = pool.map(c=>[rank(c)+Math.random()*0.9,c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  di = 0; revealed = false;
}
function drill(){
  const t = $('#t-drill');
  const opts = ['All','Beginner','Hard','Sophisticated Investor'].map(l=>`<option ${l===dl?'selected':''}>${l}</option>`).join('');
  let h = `<div class="drillbar"><label for="dlv">Level</label><select id="dlv">${opts}</select><span>Weak ones come first.</span></div>`;
  if(!drillOrder.length){ h += '<div class="empty">No objections at this level.</div>'; t.innerHTML = h; return; }
  if(di >= drillOrder.length){
    h += `<div class="panel"><h2 style="margin-top:0">Round done</h2><p>Nailed ${D.cards.filter(c=>prog[c.id]==='n').length} of ${D.cards.length}. Weak ones will come first next round.</p><button class="btn pri" id="again">Run another round</button></div>`;
    t.innerHTML = h; return;
  }
  const c = drillOrder[di];
  h += `<div class="panel"><h3 style="margin-top:0">${di+1} of ${drillOrder.length} &middot; ${esc(c.cat)} &middot; ${esc(c.level)}</h3>
    <p class="quote">${esc(c.line)}</p>`;
  if(!revealed){
    h += `<p class="prompt">Say your answer out loud first. Ask a question before you explain. Then reveal.</p>
    <div class="actions"><button class="btn pri" id="reveal">Reveal model answer</button><button class="btn" id="skip">Skip</button></div>`;
  } else {
    h += `<h3>Really afraid of</h3><div>${nm(c.fear)}</div>
      <h3>Ask first</h3><ul style="margin:0;padding-left:18px">${c.open.map(o=>`<li>${nm(o)}</li>`).join('')}</ul>
      <h3>Answer</h3>${steps(c)}
      <h3>Close</h3><div><b>${nm(c.close)}</b></div>
      <h3>If they push back</h3><div>${nm(c.bounce.c)}</div><div style="margin-top:4px">${nm(c.bounce.r)}</div>
      <div class="box dont"><b>Don't</b><ul>${c.dont.map(d=>`<li>${nm(d)}</li>`).join('')}</ul></div>
      <div class="actions"><button class="btn good" data-dm="n">Nailed it</button><button class="btn bad" data-dm="w">Still weak</button></div>`;
  }
  h += '</div>';
  t.innerHTML = h;
}

document.addEventListener('click', e=>{
  const tb = e.target.closest('nav button');
  if(tb){ document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected', b===tb));
    document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on', s.id==='t-'+tb.dataset.t));
    if(tb.dataset.t==='drill'){ if(!drillOrder.length) buildDeck(); drill(); } window.scrollTo(0,0); return; }
  const ch = e.target.closest('[data-f]'); if(ch){ filter = ch.dataset.f; cards(); return; }
  const mk = e.target.closest('[data-mark]'); if(mk){ const id = +mk.dataset.id; open = id;
    if(mk.dataset.mark==='x') delete prog[id]; else prog[id] = mk.dataset.mark; save(); stats(); cards(); return; }
  if(e.target.id==='reveal'){ revealed = true; drill(); return; }
  if(e.target.id==='skip'){ di++; revealed = false; drill(); return; }
  if(e.target.id==='again'){ buildDeck(); drill(); return; }
  const dm = e.target.closest('[data-dm]'); if(dm){ prog[drillOrder[di].id] = dm.dataset.dm; save(); stats(); di++; revealed = false; drill(); return; }
});
document.addEventListener('toggle', e=>{ const d = e.target; if(d.classList && d.classList.contains('card') && d.open) open = +d.dataset.id; }, true);
document.addEventListener('change', e=>{
  if(e.target.id==='dlv'){ dl = e.target.value; buildDeck(); drill(); }
  if(e.target.id==='hide'){ hide = e.target.checked; save(); method(); cards(); drill(); }
});


/* ---------- Ask + Role-play (Claude inside the page) ---------- */
let SAMPLE = null, ctl = null, askTurns = [], rpTurns = [], rpCard = null, rpBusy = false, speak = false;
const aiReady = (async()=>{ try{ SAMPLE = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; }catch(e){ SAMPLE = null; } })();

function bankText(){
  const nmx = s => hide ? s.replace(/Kieran/g,'Coach').replace(/\bCol\b/g,'Coach') : s;
  const rules = D.method.map(m=>`- ${m.t}: ${m.d}`).join('\n');
  const cs = D.cards.map(c=>`#${c.id} ${c.title} [${c.level}]\nClient: ${c.line}\nReal fear: ${c.fear}\nAsk first: ${c.open.join(' | ')}\nAnswer: ${c.say.map(s=>s.l+': '+s.t).join(' ')}\nFundamentals: ${c.pivot}\nClose: ${c.close}\nHarder come-back: ${c.bounce.c} -> ${c.bounce.r}\nDon't: ${c.dont.join(' | ')}\nCheck: ${c.flag}`).join('\n\n');
  return nmx(`RULES:\n${rules}\n\nFACTS (dated ${D.asof}):\n${D.facts.join('\n')}\n\nOBJECTION BANK:\n${cs}`);
}
const ASK_INSTR = () => `You are Norval's sales coach. Norval sells new-build property investment packages to ADF members and veterans (Victoria, SEQ Queensland, Townsville, Adelaide, Perth, Darwin). Answer ONLY from the bank below. If the question is not covered, say so plainly and give the closest rule. Never invent figures. Never guarantee growth, rates or valuations. Never name builders. Never use the word "free". Format: the bottom line first, then a short script in Norval's voice (direct, warm, short sentences, commas not dashes, three to five sentences) that asks a question before it explains and ends on a closing question, then one risk to watch. Under 180 words unless asked for more. Plain text, no markdown.\n\n${bankText()}`;
const RP_INSTR = c => `You are role-playing a difficult but realistic Australian property client on a review call with Norval, who sells new-build investment property. Your opening objection: "${c.line}" Real fear behind it: ${c.fear}\nRules: stay in character. 1 to 3 sentences per turn, conversational, no stage directions, no coaching. Never help Norval or reveal the model answer. After his reply, push back harder using the harder come-back below or a hidden objection. If he asked a good question first and held course, soften a little. If he rambles, confirms a limitation, panics or promises growth, press on it. After three or four exchanges, either give a conditional buying signal or a firm stall. Do not break character until the viewer sends the word SCORE. Dollars are AUD. Start now with your opening line only.\n\nHarder come-back for this objection: ${c.bounce.c}\n\n${bankText()}`;
const SC_INSTR = (c,tr) => `You are Norval's sales coach scoring a role-play. Score Norval's answers against these rules: asked a question before explaining (never went first), one objection at a time, did not confirm a limitation, held course instead of running to the worst case, went back to fundamentals, short and sharp (3 to 5 sentences), used numbers or did the maths together, led with authority where needed, closed on a question, no guarantees. Objection practised: ${c.title}.\nReply in plain text, under 220 words, in this order: SCORE out of 10 and one-line verdict; WHAT WORKED (1-2 points); BIGGEST MISS (1-2 points, quote his words); BETTER VERSION (a model reply in Norval's voice, under 70 words, ending on a question); ONE HABIT to drill next. Be frank, no flattery.\n\nTRANSCRIPT:\n${tr}\n\nBANK ENTRY:\n${bankText()}`;

const ERR = {not_granted:'You declined Claude for this page. Reload and allow it to use Ask and Role-play.', sampling_disabled:'Claude is not available on this account.', rate_limited:'Too many calls or usage limit reached. Wait a bit, then try again.', session_expired:'Sign in again, then reload.', upstream_error:'The connection dropped. Try again.', refused:'Claude declined that input. Rephrase it.', empty_completion:'No answer came back. Rephrase and try again.', prompt_too_large:'That conversation got too long. Reset and start again.'};
const errTxt = e => ERR[e && e.code] || 'Something went wrong. Try again.';

function say(text){ if(!speak) return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='en-AU'; speechSynthesis.speak(u); }catch(e){} }
function bubble(log, who, text){ const d = document.createElement('div'); d.className = 'msg '+(who==='me'?'me':who==='sc'?'sc':'ai'); const b = document.createElement('b'); b.textContent = who==='me'?'You':who==='sc'?'Score':(log.id==='rplog'?'Client':'Coach'); const s = document.createElement('span'); s.textContent = text; d.append(b,s); log.append(d); d.scrollIntoView({block:'nearest'}); return s; }
const speakBox = () => ('speechSynthesis' in window) ? `<label class="names"><input type="checkbox" id="spk" ${speak?'checked':''}> Read replies aloud</label>` : '';

function askUI(){
  $('#t-ask').innerHTML = `
    <h2 style="margin-top:0">Ask the coach</h2>
    <div class="note">Answers come only from your 15 objections and the ten rules. Tap the mic on your phone keyboard to dictate.</div>
    <div class="chips" id="askeg">${['They say "I want to think about it". What do I ask first?','How do I explain delayed registration in two minutes?','Client says "just rates, I\'ll wait". Give me the script.'].map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <textarea id="aq" placeholder="Type or dictate your question"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" id="askgo">Ask</button><button class="btn" id="askstop" hidden>Stop</button><button class="btn" id="askreset">Clear</button>${speakBox()}</div>
    <div class="log" id="asklog"></div>`;
}
async function doAsk(){
  const q = $('#aq').value.trim(); if(!q) return;
  await aiReady; const log = $('#asklog');
  if(!SAMPLE){ bubble(log,'ai','Ask runs inside Claude. Open this page in claude.ai to use it.'); return; }
  $('#aq').value=''; bubble(log,'me',q);
  askTurns.push({role:'user',content:q});
  const out = bubble(log,'ai','Thinking...'); ctl = new AbortController();
  $('#askgo').disabled = true; $('#askstop').hidden = false;
  try{
    const turns = [{role:'user',content:ASK_INSTR()}, ...askTurns.slice(-8)];
    const r = await SAMPLE(turns,{cache:false,signal:ctl.signal,onText:({text})=>{out.textContent=text;}});
    askTurns.push({role:'assistant',content:r.text}); say(r.text);
  }catch(e){ askTurns.pop(); if(e.code==='cancelled'){ out.textContent = e.text || '(stopped)'; } else { out.textContent = (e.text? e.text+'\n\n':'') + errTxt(e); } }
  finally{ $('#askgo').disabled = false; $('#askstop').hidden = true; }
}

function rpUI(){
  const opts = ['<option value="0">Surprise me</option>'].concat(D.cards.map(c=>`<option value="${c.id}">${String(c.id).padStart(2,'0')} ${esc(c.title)}</option>`)).join('');
  $('#t-rp').innerHTML = `
    <h2 style="margin-top:0">Role-play</h2>
    <div class="note">Claude plays a difficult client. Reply as you would on the call, then tap Score me. Type or dictate with your keyboard mic.</div>
    <div class="row"><select id="rpsel" aria-label="Objection">${opts}</select><button class="btn pri" id="rpstart">Start</button><button class="btn" id="rpreset">Reset</button>${speakBox()}</div>
    <div class="log" id="rplog"></div>
    <div id="rpctl" hidden>
      <textarea id="rpin" placeholder="Your reply to the client"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn pri" id="rpsend">Send</button><button class="btn" id="rpstop" hidden>Stop</button><button class="btn good" id="rpscore" disabled>Score me</button></div>
    </div>
    <div class="row" id="rpmark" hidden style="margin-top:10px"><span class="note">Mark this objection:</span><button class="btn good" data-rm="n">Nailed it</button><button class="btn bad" data-rm="w">Still weak</button></div>`;
}
function rpTranscript(){ return rpTurns.slice(1).map(m=>(m.role==='assistant'?'CLIENT: ':'NORVAL: ')+m.content).join('\n'); }
async function rpCall(first){
  await aiReady; const log = $('#rplog');
  if(!SAMPLE){ bubble(log,'ai','Role-play runs inside Claude. Open this page in claude.ai to use it.'); return; }
  const out = bubble(log,'ai','Thinking...'); ctl = new AbortController(); rpBusy = true;
  $('#rpsend').disabled = true; $('#rpscore').disabled = true; $('#rpstop').hidden = false;
  try{
    const r = await SAMPLE(rpTurns,{cache:false,modelTier:'quick',signal:ctl.signal,onText:({text})=>{out.textContent=text;}});
    rpTurns.push({role:'assistant',content:r.text}); say(r.text);
  }catch(e){
    if(first) rpTurns = rpTurns.slice(0,1); else rpTurns.pop();
    out.textContent = e.code==='cancelled' ? (e.text||'(stopped)') : ((e.text?e.text+'\n\n':'')+errTxt(e));
  } finally{ rpBusy=false; $('#rpsend').disabled=false; $('#rpstop').hidden=true; $('#rpscore').disabled = rpTurns.filter(m=>m.role==='user').length<2; }
}
async function rpStart(){
  const v = +$('#rpsel').value; rpCard = v ? D.cards.find(c=>c.id===v) : D.cards[Math.floor(Math.random()*D.cards.length)];
  $('#rplog').innerHTML=''; $('#rpmark').hidden = true; $('#rpctl').hidden = false;
  rpTurns = [{role:'user',content:RP_INSTR(rpCard)}];
  bubble($('#rplog'),'sc','Objection: '+rpCard.title+' ('+rpCard.level+')');
  await rpCall(true);
}
async function rpSend(){
  const v = $('#rpin').value.trim(); if(!v || rpBusy || rpTurns.length<2) return;
  $('#rpin').value=''; bubble($('#rplog'),'me',v); rpTurns.push({role:'user',content:v});
  if(rpTurns.length>14){ rpTurns = [rpTurns[0], ...rpTurns.slice(-12)]; if(rpTurns[1].role==='user') rpTurns.splice(1,1); }
  await rpCall(false);
}
async function rpScore(){
  await aiReady; if(!SAMPLE || rpTurns.length<3) return; const log = $('#rplog');
  const out = bubble(log,'sc','Scoring...'); ctl = new AbortController(); $('#rpscore').disabled = true; $('#rpsend').disabled = true;
  try{
    const r = await SAMPLE(SC_INSTR(rpCard, rpTranscript()),{cache:false,signal:ctl.signal,onText:({text})=>{out.textContent=text;}});
    say(r.text); $('#rpmark').hidden = false;
  }catch(e){ out.textContent = e.code==='cancelled' ? (e.text||'(stopped)') : errTxt(e); }
  finally{ $('#rpsend').disabled = false; $('#rpscore').disabled = false; }
}

document.addEventListener('click', e=>{
  const q = e.target.closest('[data-q]'); if(q){ $('#aq').value = q.dataset.q; $('#aq').focus(); return; }
  if(e.target.id==='askgo') return void doAsk();
  if(e.target.id==='askstop' || e.target.id==='rpstop') return void (ctl && ctl.abort());
  if(e.target.id==='askreset'){ askTurns=[]; $('#asklog').innerHTML=''; return; }
  if(e.target.id==='rpstart') return void rpStart();
  if(e.target.id==='rpsend') return void rpSend();
  if(e.target.id==='rpscore') return void rpScore();
  if(e.target.id==='rpreset'){ if(ctl) ctl.abort(); rpTurns=[]; $('#rplog').innerHTML=''; $('#rpctl').hidden=true; $('#rpmark').hidden=true; return; }
  const rm = e.target.closest('[data-rm]'); if(rm && rpCard){ prog[rpCard.id] = rm.dataset.rm; save(); stats(); cards(); rm.parentElement.hidden = true; return; }
});
document.addEventListener('change', e=>{ if(e.target.id==='spk'){ speak = e.target.checked; if(!speak){ try{ speechSynthesis.cancel(); }catch(x){} } } });
askUI(); rpUI();

load(); $('#hide').checked = hide; $('#asof').textContent = D.asof;
stats(); method(); cards(); buildDeck();
</script>
